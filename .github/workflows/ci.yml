name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up pnpm and Node.js
              uses: pnpm/setup@v2

            - name: Install dependencies
              run: pnpm run ci:install

            - name: Run CI checks
              run: pnpm run ci:check
